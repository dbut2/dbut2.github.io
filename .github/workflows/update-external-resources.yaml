name: Update External Resources

env:
  RESOURCES: |
    {
      "sapphire": {
        "repo": "dbut2/sapphire",
        "files": {
          "sapphire.wasm": "static/sapphire.wasm"
        },
        "go_files": {
          "lib/wasm/wasm_exec.js": "static/sapphire-wasm-exec.js"
        }
      }
    }

on:
  repository_dispatch:
    types: [update-external-resource]
  workflow_dispatch:
    inputs:
      resource:
        description: 'Resource to update'
        required: true
        default: 'sapphire'
      tag:
        description: 'Release tag to deploy'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          path: site
          token: ${{ steps.token.outputs.token }}

      - name: Parse config
        id: config
        env:
          RESOURCE: ${{ github.event.inputs.resource || github.event.client_payload.resource }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          CONFIG=$(echo "$RESOURCES" | jq -r --arg r "$RESOURCE" '.[$r]')
          REPO=$(echo "$CONFIG" | jq -r '.repo')

          [ "$TAG" = "latest" ] && TAG=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)

          echo "resource=$RESOURCE" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.config.outputs.repo }}
          ref: ${{ steps.config.outputs.tag }}
          path: resource

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Get Go version
        id: go-version
        run: |
          cd resource
          GO_VERSION=$(go list -m -f '{{.GoVersion}}')
          echo "version=$GO_VERSION" >> $GITHUB_OUTPUT

      - name: Update resource files
        env:
          RESOURCE: ${{ steps.config.outputs.resource }}
          REPO: ${{ steps.config.outputs.repo }}
          TAG: ${{ steps.config.outputs.tag }}
          GO_VERSION: ${{ steps.go-version.outputs.version }}
        run: |
          CONFIG=$(echo "$RESOURCES" | jq -r --arg r "$RESOURCE" '.[$r]')

          cd site
          for ASSET in $(echo "$CONFIG" | jq -r '.files | keys[]'); do
            DEST=$(echo "$CONFIG" | jq -r ".files.\"$ASSET\"")
            mkdir -p "$(dirname "$DEST")"
            curl -sL -o "$DEST" "https://github.com/$REPO/releases/download/$TAG/$ASSET"
          done

          for GO_FILE in $(echo "$CONFIG" | jq -r '.go_files | keys[]'); do
            DEST=$(echo "$CONFIG" | jq -r ".go_files.\"$GO_FILE\"")
            mkdir -p "$(dirname "$DEST")"
            curl -sL -o "$DEST" "https://raw.githubusercontent.com/golang/go/go$GO_VERSION/$GO_FILE"
          done

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          path: site
          labels: automerge
          author: dylan-botler[bot] <230545208+dylan-botler[bot]@users.noreply.github.com>
          committer: dylan-botler[bot] <230545208+dylan-botler[bot]@users.noreply.github.com>
          commit-message: 'Update ${{ steps.config.outputs.resource }} to ${{ steps.config.outputs.tag }}'
          title: 'Update ${{ steps.config.outputs.resource }} to ${{ steps.config.outputs.tag }}'
          body: "beep boop beep boop, I've updated ${{ steps.config.outputs.resource }} for you. Release: https://github.com/${{ steps.config.outputs.repo }}/releases/tag/${{ steps.config.outputs.tag }}"
          branch: update-${{ steps.config.outputs.resource }}
          delete-branch: true
