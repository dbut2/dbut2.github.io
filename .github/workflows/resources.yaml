name: Hugo /resources

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: peaceiris/actions-hugo@v3

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - run: |
          rm -rf resources
          hugo

      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_CLIENT_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          branch: hugo-resources
          delete-branch: true
          add-paths: resources
          commit-message: Hugo /resources
          title: Hugo /resources
          body: beep boop beep boop, I've regenerated Hugo resources for you
          author: dylan-botler[bot] <230545208+dylan-botler[bot]@users.noreply.github.com>
          committer: dylan-botler[bot] <230545208+dylan-botler[bot]@users.noreply.github.com>
